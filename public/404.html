<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scottie Murrell — Software Engineer</title>
    <!--
      GitHub Pages serves this file for any unknown path. It re-encodes the
      requested path as a query string and redirects to index.html, which then
      restores the real path via the script in src/index.html.
      pathSegmentsToKeep = 0 because this is a user site served at the domain root.
      Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
