<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scottie Murrell — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Scottie Murrell — full-stack and XR software engineer."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!--
      GitHub Pages has no server-side rewrites, so a hard refresh on a deep route
      (e.g. /projects/webxr) 404s. This restores the intended path before Angular
      boots, using the redirect written into 404.html.
      Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
