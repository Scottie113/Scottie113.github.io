<a class="card project-card" [routerLink]="['/projects', project().slug]">
  <div class="meta-row">
    <span class="category">{{ project().category }}</span>
    @if (project().role) {
      <span class="role-badge">{{ project().role }}</span>
    }
    @if (project().videos?.length) {
      <span class="role-badge video-badge">Video</span>
    }
  </div>
  <h3>{{ project().title }}</h3>
  <p>{{ project().summary }}</p>
  <ul class="tech-list">
    @for (tech of project().technologies; track tech) {
      <li class="tag">{{ tech }}</li>
    }
  </ul>
  <span class="view-link">View project →</span>
</a>
